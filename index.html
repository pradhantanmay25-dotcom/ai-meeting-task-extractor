<body>
    <div class="card">
        <h2>Notes Extractor</h2>
        
        <textarea id="transcript" placeholder="Paste meeting transcript here..."></textarea>
        
        <button id="extract-btn">Extract Tasks</button>
        
        <div id="results-container">
            <div id="loading-state">
                <div class="spinner"></div>
                <div>Analyzing transcript...</div>
            </div>
            <div id="output"></div>
        </div>
    </div>

    <script>
        // Use the exact provided API key
        const API_KEY = "YOUR_GEMINI_API_KEY_HERE";
        
        // Define the correct v1beta endpoint utilizing the gemini-3.8-flash model
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`;

        document.getElementById('extract-btn').addEventListener('click', async () => {
            const userText = document.getElementById('transcript').value.trim();
            const extractBtn = document.getElementById('extract-btn');
            const resultsContainer = document.getElementById('results-container');
            const loadingState = document.getElementById('loading-state');
            const outputDiv = document.getElementById('output');

            if (!userText) {
                alert("Please paste a meeting transcript first.");
                return;
            }

            // Reset and show loading state
            outputDiv.innerHTML = "";
            resultsContainer.style.display = "block";
            loadingState.style.display = "block";
            extractBtn.disabled = true;
            extractBtn.textContent = "Extracting...";

            // Constructing the payload utilizing v1beta features: systemInstruction
            const payload = {
                "systemInstruction": {
                    "parts": [
                        { "text": "Act as an expert project manager. Analyze the meeting transcript. Cleanly extract all individual action items, assignees, and deadlines in bold bullet points." }
                    ]
                },
                "contents": [
                    { 
                        "parts": [
                            { "text": "Transcript:\n" + userText }
                        ] 
                    }
                ],
                "generationConfig": { 
                    "maxOutputTokens": 2048 
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // Detailed Error Handling for API rejections
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.error?.message || response.statusText;
                    throw new Error(`API Error ${response.status}: ${errorMsg}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    let extractedText = data.candidates[0].content.parts[0].text;
                    
                    // Convert Markdown bold (**text**) to HTML bold (<b>text</b>) 
                    // so it displays correctly with CSS pre-wrap
                    extractedText = extractedText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    
                    outputDiv.innerHTML = extractedText;
                } else {
                    throw new Error("Unexpected response format from the API.");
                }

            } catch (error) {
                console.error("Fetch error:", error);
                outputDiv.innerHTML = `<div class="error-text">Failed to extract notes.<br><br><small>${error.message}</small></div>`;
            } finally {
                // Restore UI state
                loadingState.style.display = "none";
                extractBtn.disabled = false;
                extractBtn.textContent = "Extract Tasks";
            }
        });
    </script>
</body>
</html>
